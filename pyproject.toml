[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "live-recognition"
version = "0.1.0"
description = "POC for probabilistic Rubik's Cube recognition from video"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "torch>=2.2",
  "timm>=1.0",
  "ultralytics>=8.3",
  "clip @ git+https://github.com/ultralytics/CLIP.git",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
cube-orient = "live_recognition.cli:main"
cube-piece-graph = "live_recognition.piece_graph_cli:main"
cube-net = "live_recognition.net_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
